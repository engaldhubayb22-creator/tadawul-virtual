# Production stack. From the repository root:
#   cp deploy/.env.example deploy/.env    # then edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Only the web container is reachable from outside. Put a TLS terminator in
# front of it before opening the site to users (see deploy/README.md).

x-api-env: &api-env
  APP_NAME: "Tadawul Virtual"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?set APP_KEY in deploy/.env}
  APP_URL: ${APP_URL:-http://localhost}
  APP_LOCALE: ar
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: tadawul
  DB_USERNAME: tadawul
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  CACHE_STORE: redis
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync

x-go-env: &go-env
  DATABASE_URL: postgres://tadawul:${POSTGRES_PASSWORD}@postgres:5432/tadawul?sslmode=disable
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tadawul
      POSTGRES_USER: tadawul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Riyadh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tadawul -d tadawul"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    # The order queue lives here: keep it on disk across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the tables, then exits.
  migrate:
    build: { context: .., dockerfile: api/Dockerfile }
    image: tadawul-virtual-api
    environment: *api-env
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Loads the starter companies and the market-maker accounts, then exits.
  seed:
    build: { context: .., dockerfile: engine/Dockerfile }
    image: tadawul-virtual-engine
    environment: *go-env
    command: ["seed"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  engine:
    image: tadawul-virtual-engine
    restart: unless-stopped
    environment: *go-env
    command: ["engine"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  feed:
    image: tadawul-virtual-engine
    restart: unless-stopped
    environment:
      <<: *go-env
      FEED_ADDR: ":8090"
    command: ["feed"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  bot:
    image: tadawul-virtual-engine
    restart: unless-stopped
    environment:
      <<: *go-env
      BOT_INTERVAL_MS: ${BOT_INTERVAL_MS:-1000}
    command: ["bot"]
    depends_on:
      engine: { condition: service_started }

  api:
    image: tadawul-virtual-api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Margin calls and liquidations run from Laravel's scheduler every minute.
  scheduler:
    image: tadawul-virtual-api
    restart: unless-stopped
    environment: *api-env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: web/Dockerfile }
    image: tadawul-virtual-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
      - feed

volumes:
  pgdata:
  redisdata:
