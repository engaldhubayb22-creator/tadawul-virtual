# The one public entry point: the web app, the API and the live feed share
# an origin, so the browser needs no CORS and one certificate covers all.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: every request goes to Laravel's front controller.
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass api:9000;
        fastcgi_read_timeout 30s;
    }

    # Live feed: long-lived WebSocket connections.
    location /ws {
        proxy_pass http://feed:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Built assets have a content hash in their names: cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app itself must always be fresh so a deploy takes effect at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
