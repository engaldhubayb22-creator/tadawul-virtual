# Local development services. Centrifugo and the app containers are added
# in the next step, once the engine service and the Laravel API exist.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tadawul
      POSTGRES_USER: tadawul
      POSTGRES_PASSWORD: tadawul_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
